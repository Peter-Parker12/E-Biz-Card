services:
  card:
    build: .
    restart: unless-stopped
    ports:
      # <host-port>:80 — the container's nginx always listens on 80 internally,
      # so the second number here must stay 80. Change only the host-side port
      # (left of the colon) if 80/443 on the VPS are already taken by another
      # reverse proxy — in that case, add a server block there that proxies to
      # 127.0.0.1:<host-port>, see README.md.
      - "3480:80"
    volumes:
      # Mounts the whole site directory (not just config.json) so any edit —
      # content, styling, photos — is picked up live with no rebuild needed.
      # Bind-mounting a single file can get "stuck" on the old file after git
      # pull/editors replace it (rename-over-original changes the inode);
      # mounting the directory avoids that entirely.
      - ./docs:/usr/share/nginx/html:ro
