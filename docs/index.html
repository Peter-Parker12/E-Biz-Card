<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Digital Business Card</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main id="app">
    <section class="page id-page" data-page>
      <div class="id-card id-front">
        <div class="id-watermark"></div>

        <div class="id-top">
          <div class="id-photo" id="photo-box">
            <img id="photo-img" alt="" hidden />
            <span id="photo-initials"></span>
          </div>
          <div class="id-brand">
            <a class="id-brand-name" id="brand-name" target="_blank" rel="noopener noreferrer"></a>
            <div class="id-brand-sub" id="brand-subtitle"></div>
            <ul class="id-tags" id="tags-list"></ul>
          </div>
        </div>

        <div class="id-bottom">
          <div class="id-name-block">
            <h1 class="id-name" id="name-display-front"></h1>
            <div class="id-role-row">
              <span class="id-title" id="title-display-front"></span>
              <span class="id-number" id="card-number-display"></span>
            </div>
          </div>
          <a class="id-barcode" id="barcode-link" target="_blank" rel="noopener noreferrer">
            <div class="barcode-bars"></div>
            <div class="barcode-text" id="id-number-display"></div>
          </a>
        </div>
      </div>
    </section>

    <section class="page id-page" data-page>
      <div class="id-card id-back">
        <div class="id-back-brand-block">
          <a class="id-back-brand" id="brand-name-back" target="_blank" rel="noopener noreferrer"></a>
          <a class="id-back-brand-secondary" id="brand-name-back-secondary" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div class="id-stripe"></div>
        <div class="id-signature-row">
          <div class="id-signature-strip">
            <img id="signature-img" alt="" hidden />
            <span id="signature-text"></span>
          </div>
          <span class="id-star">&#9733;</span>
        </div>
        <div class="id-back-bottom">
          <span class="id-back-number" id="id-number-back"></span>
          <span class="id-back-name" id="name-display-back"></span>
        </div>
      </div>
    </section>

    <section class="page id-page" data-page>
      <div class="id-card id-actions">
        <div class="id-watermark"></div>
        <button class="btn" id="save-contact-btn" type="button">Save Contact</button>
        <div class="action-groups" id="action-groups"></div>
        <footer class="credit" id="credit-display"></footer>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
